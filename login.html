<!doctype html><html lang="vi"><body style="background:#111;color:#fff;font-family:Arial;padding:40px"><div style="max-width:400px;margin:auto;background:#191919;padding:25px;border-radius:10px"><h1>Đăng nhập</h1><input id="u" placeholder="Tài khoản" style="width:100%;padding:10px;margin:6px 0"><input id="p" type="password" placeholder="Mật khẩu" style="width:100%;padding:10px;margin:6px 0"><button onclick="login()" style="padding:10px;background:#f44;color:#fff;border:0">Đăng nhập</button><a href="/register.html" style="margin-left:10px;color:#f77">Đăng ký</a><p id="e"></p></div><script>async function login(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});if(r.ok)location.href='/';else e.textContent=(await r.json()).error}</script></body></html>
