<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MangaVN</title><style>body{margin:0;background:#111;color:#eee;font-family:Arial}header{padding:16px;background:#191919;display:flex;gap:20px;align-items:center}.logo{font-size:25px;font-weight:bold}.logo span{color:#f44}.container{width:min(1100px,94%);margin:auto}.hero{margin:25px 0;padding:35px;border-radius:12px;background:linear-gradient(120deg,#411c28,#1c2140)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#1b1b1b;padding:10px;border-radius:8px}.cover{height:270px;border-radius:6px;background:#52283b center/cover no-repeat}.btn{background:#f44;color:#fff;border:0;padding:9px 13px;border-radius:6px;cursor:pointer}input{padding:9px;background:#222;color:#fff;border:1px solid #333;border-radius:6px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><header><div class="container" style="display:flex;align-items:center;gap:20px"><div class="logo"><span>Manga</span>VN</div><a href="/admin.html" style="color:#aaa">Admin</a><button class="btn" onclick="openLogin()">Đăng nhập</button></div></header><main class="container"><div class="hero"><h1>Kho truyện MangaVN</h1><p>Đọc truyện, chương và bình luận trực tuyến.</p></div><h2>Truyện mới</h2><div id="grid" class="grid"></div></main><script>async function load(){const a=await fetch('/api/comics').then(r=>r.json());grid.innerHTML=a.map(c=>`<div class="card"><a href="/reader.html?slug=${encodeURIComponent(c.slug)}"><div class="cover" style="background-image:url('${c.cover||''}')"></div><h3>${esc(c.title)}</h3></a><small>${c.chapters} chương</small></div>`).join('')}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function openLogin(){location.href='/login.html'}load()</script></body></html>
