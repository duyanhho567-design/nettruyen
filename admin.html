<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel</title><style>body{margin:0;background:#101010;color:#eee;font-family:Arial}.layout{display:flex;min-height:100vh}.side{width:220px;background:#191919;padding:20px}.main{padding:25px;flex:1}.panel{background:#191919;padding:20px;border-radius:10px;margin-bottom:20px}.field{margin:12px 0}.field input,.field textarea{width:100%;padding:10px;background:#222;color:#fff;border:1px solid #444;box-sizing:border-box}.btn{background:#f44;color:#fff;border:0;padding:10px;border-radius:6px;cursor:pointer}.coverPreview{max-width:160px;max-height:200px;margin-top:10px}.pages{display:flex;gap:8px;flex-wrap:wrap}.pages img{width:90px;height:120px;object-fit:cover}.side a{display:block;padding:10px;color:#aaa}</style></head><body><div class="layout"><aside class="side"><h2><span style="color:#f44">Manga</span>VN</h2><a href="/">← Website</a><a href="#comic">📚 Đăng truyện</a><a href="#chapter">🖼️ Thêm chương</a><a href="#users">👥 Người dùng</a></aside><main class="main"><h1>Admin Panel</h1><div id="loginRequired"></div><section class="panel" id="comic"><h2>Đăng truyện</h2><form id="comicForm"><div class="field"><input name="title" placeholder="Tên truyện" required></div><div class="field"><textarea name="description" placeholder="Mô tả"></textarea></div><div class="field"><input id="cover" name="cover" type="file" accept="image/*"></div><img id="coverPreview" class="coverPreview"><button class="btn">Đăng truyện</button></form><p id="comicMsg"></p></section><section class="panel" id="chapter"><h2>Thêm chương + hình ảnh</h2><div class="field"><input id="comicId" placeholder="ID truyện"></div><form id="chapterForm"><div class="field"><input name="number" type="number" min="1" placeholder="Số chương" required></div><div class="field"><input name="title" placeholder="Tên chương"></div><div class="field"><input id="pages" name="pages" type="file" accept="image/*" multiple required></div><div id="pagePreview" class="pages"></div><button class="btn">Lưu chương</button></form><p id="chapterMsg"></p></section><section class="panel" id="users"><h2>Quản lý quyền Admin</h2><button class="btn" onclick="users()">Tải danh sách</button><div id="usersList"></div></section></main></div><script>async function check(){const r=await fetch('/api/me');const x=await r.json();if(!x.user||x.user.role!=='admin')loginRequired.innerHTML='<p>Bạn cần đăng nhập bằng tài khoản Admin.</p><a href="/login.html">Đăng nhập</a>'}cover.onchange=()=>{const f=cover.files[0];if(f)coverPreview.src=URL.createObjectURL(f)};pages.onchange=()=>{pagePreview.innerHTML='';[...pages.files].forEach(f=>{const i=document.createElement('img');i.src=URL.createObjectURL(f);pagePreview.appendChild(i)})};comicForm.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/admin/comics',{method:'POST',body:new FormData(comicForm)});comicMsg.textContent=r.ok?'Đã đăng truyện.':'Lỗi: '+(await r.json()).error};chapterForm.onsubmit=async e=>{e.preventDefault();const fd=new FormData(chapterForm);const r=await fetch('/api/admin/comics/'+comicId.value+'/chapters',{method:'POST',body:fd});chapterMsg.textContent=r.ok?'Đã lưu chương và ảnh.':'Lỗi: '+(await r.json()).error};async function users(){const r=await fetch('/api/admin/users');const a=await r.json();usersList.innerHTML=a.map(u=>`<p>${u.username} — ${u.role} <button class="btn" onclick="role(${u.id},'admin')">Admin</button> <button class="btn" onclick="role(${u.id},'user')">Thu hồi</button></p>`).join('')}async function role(id,role){await fetch('/api/admin/users/'+id+'/role',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({role})});users()}check()</script></body></html>
