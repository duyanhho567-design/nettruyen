<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đọc truyện</title><style>body{margin:0;background:#0d0d0d;color:#eee;font-family:Arial}.bar{position:sticky;top:0;background:#181818;padding:12px;display:flex;justify-content:space-between}.reader{width:min(900px,100%);margin:auto}.pages img{display:block;width:100%;height:auto}.comment{padding:20px;background:#181818;margin:25px 0}.comment textarea{width:100%;height:80px;background:#222;color:#fff}.btn{background:#f44;color:#fff;border:0;padding:9px;border-radius:6px;margin:5px}</style></head><body><div class="bar"><a href="/">← Trang chủ</a><b id="title">Đọc truyện</b><span></span></div><main class="reader"><h1 id="comic"></h1><h3>Chương <span id="num"></span></h3><div id="pages" class="pages"></div><div><button class="btn" onclick="change(-1)">← Chương trước</button><button class="btn" onclick="change(1)">Chương sau →</button></div><div class="comment"><h2>💬 Bình luận</h2><textarea id="text" placeholder="Viết bình luận..."></textarea><br><button class="btn" onclick="comment()">Đăng</button><div id="comments"></div></div></main><script>const q=new URLSearchParams(location.search);const slug=q.get('slug');let id=Number(q.get('chapter'));let data,comic;async function load(){comic=await fetch('/api/comics/'+encodeURIComponent(slug)).then(r=>r.json());if(!id)id=comic.chapters[0]?.id;data=await fetch('/api/chapters/'+id).then(r=>r.json());document.getElementById('comic').textContent=data.comic_title;document.getElementById('title').textContent=data.comic_title;num.textContent=data.number;pages.innerHTML=data.pages.map(p=>`<img src="${p.image}" alt="Trang ${p.page_no}">`).join('');comments.innerHTML=data.comments.map(c=>`<p><b>${esc(c.username)}</b>: ${esc(c.text)}</p>`).join('')}async function change(n){const i=comic.chapters.findIndex(c=>c.id===id),next=comic.chapters[i+n];if(next){id=next.id;history.replaceState({},'',`reader.html?slug=${encodeURIComponent(slug)}&chapter=${id}`);load();scrollTo(0,0)}}async function comment(){const r=await fetch('/api/chapters/'+id+'/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text.value})});if(r.ok){text.value='';load()}else alert((await r.json()).error)}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load()</script></body></html>
